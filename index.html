        /* --- IMAGE COMPRESSION ENGINE --- */
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; 
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_WIDTH) { width *= MAX_WIDTH / height; height = MAX_WIDTH; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                        <div class="absolute top-0 right-0 bg-orange-500 text-white text-[9px] font-bold px-3 py-1 rounded-bl-xl">Urgent</div>

                        <p class="text-gray-700"><i class="fa-solid fa-location-dot text-red-500 w-4"></i> ${job.state}, ${job.township}</p>

        // Live Chat Logic
        async function tLoadChat() {
            if(!t_id) return;
            const box = document.getElementById('t-chat-box');
            
            // Check if user is scrolled near bottom before update
            const isNearBottom = box.scrollHeight - box.clientHeight - box.scrollTop <= 50;

            const { data } = await db.from('chat_messages').select('*').eq('tutor_id', t_id).order('timestamp');
            box.innerHTML = "";
            data?.forEach(msg => {
                const me = msg.sender === 'teacher';
                let contentHTML = msg.image_data 
                    ? `<img src="${msg.image_data}" class="w-32 h-auto rounded-lg shadow-sm border mt-1">` 
                    : `<p>${msg.message}</p>`;

                box.innerHTML += `
                    <div class="flex ${me ? 'justify-end' : 'justify-start'}">
                        <div class="${me ? 'bg-blue-500 text-white rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'} p-2.5 rounded-2xl max-w-[85%] shadow-sm">
                            <p class="font-bold text-[9px] ${me ? 'text-blue-200' : 'text-gray-500'} mb-0.5">${me ? 'Me' : 'Admin'}</p>
                            ${contentHTML}
                        </div>
                    </div>
                `;
            });
            
            // Auto scroll down only if they were already near the bottom
            if (isNearBottom) box.scrollTop = box.scrollHeight;
        }

        async function sLoadTutors() {

            if(state !== 'အားလုံး') q = q.eq('state', state);
            
            const { data } = await q;
            let list = data || [];
            if(town) list = list.filter(t => t.township && t.township.includes(town));

            c.innerHTML = "";
            if(list.length === 0) { c.innerHTML = "<p class='text-gray-400 text-center py-4'>ဤဒေသတွင် ဆရာမရှိသေးပါ။</p>"; return; }

            list.forEach(t => {

                if(t.grade3 && t.subject3) subs += `• ${t.grade3} (${t.subject3})<br>`;
                if(t.grade4 && t.subject4) subs += `• ${t.grade4} (${t.subject4})<br>`;

                c.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div class="flex items-center space-x-4 border-b pb-2">
                            <img src="${t.photo || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full object-cover border-2 shadow-sm">
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-gray-800">${t.name} <span class="text-[10px] text-gray-500 font-normal">(${t.gender})</span></h4>
                                <p class="text-orange-500 font-bold text-[11px]"><i class="fa-solid fa-book"></i> ${t.curriculum} | ${t.teaching_mode}</p>
                                <p class="text-red-500 text-[11px]"><i class="fa-solid fa-location-dot"></i> ${t.state}, ${t.township}</p>
                            </div>
                        </div>
                        <div class="bg-gray-50 p-2 rounded-xl border text-[11px] leading-relaxed">
                            <span class="font-bold text-gray-600 block mb-1">သင်ကြားမည့် အတန်း/ဘာသာရပ်များ:</span>
                            ${subs || '-'}
                        </div>
                        <div class="flex justify-between items-center bg-green-50 p-2 rounded-xl border border-green-100">
                            <div>
                                <p class="text-[10px] text-gray-500">ရက်/အချိန်: ${t.days} (${t.time})</p>
                                <p class="font-bold text-green-700 text-sm">လစဉ်ကြေး: ${t.fee || 'ညှိနှိုင်း'} Ks</p>
                            </div>
                        </div>
                        <button onclick="sBookTutor(${t.id}, '${t.name}')" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 rounded-xl shadow transition"><i class="fa-solid fa-phone-volume mr-1"></i> ဒီဆရာနဲ့ သင်မယ် (တောင်းဆိုရန်)</button>
                    </div>
                `;
            });
        }

        async function openAPanel(type, title) {
            if(chatInterval) clearInterval(chatInterval); // Other panel သွားလျှင် Timer ရှင်းမည်
            
            document.getElementById('a-grid').style.display = 'none';

            document.getElementById('a-title').innerText = title;
            sub.innerHTML = "<p class='text-center py-10 text-gray-500'><i class='fa-solid fa-spinner fa-spin text-2xl mb-2'></i><br>Data ဆွဲယူနေပါသည်...</p>";

            let html = "";
            if(type === 'new') { 
                const { data } = await db.from('tutors').select('*').eq('status', 'pending');
                if(!data || data.length===0) html = "<p class='text-center text-gray-400'>စိစစ်ရန် မရှိသေးပါ</p>";
                data?.forEach(t => {
                    let dTxt = t.name ? `${t.name} (${t.phone})<br>${t.state}, ${t.grade1}` : `[Profile လွတ်]<br>U: ${t.username} | P: ${t.password}`;
                    html += `
                        <div class="bg-white p-4 rounded-xl border shadow-sm mb-3">
                            <p class="text-xs text-gray-700 leading-relaxed mb-3">${dTxt}</p>
                            <div class="flex justify-between space-x-2">
                                <button onclick="aViewTutor(${t.id}, false)" class="flex-1 bg-blue-100 text-blue-700 font-bold py-2 rounded-lg"><i class="fa-solid fa-eye"></i> Detail</button>
                                <button onclick="aApproveTutor(${t.id})" class="flex-1 bg-green-600 text-white font-bold py-2 rounded-lg"><i class="fa-solid fa-check"></i> Approve</button>
                            </div>
                        </div>
                    `;
                });
            } 
            else if(type === 'tutors') { 
                const { data } = await db.from('tutors').select('*').eq('status', 'approved');
                if(!data || data.length===0) html = "<p class='text-center text-gray-400'>စာရင်း မရှိသေးပါ</p>";
                data?.forEach(t => {
                    let n = t.name ? `${t.name} (${t.gender})` : `User: ${t.username}`;
                    html += `
                        <div class="bg-white p-4 rounded-xl border shadow-sm mb-3">
                            <p class="font-bold text-gray-800 text-sm">${n}</p>
                            <p class="text-[10px] text-gray-500 mb-2">U: ${t.username} | P: ${t.password} | Ph: ${t.phone||'-'}</p>
                            <div class="flex space-x-2">
                                <button onclick="aResetPass(${t.id})" class="flex-1 bg-orange-100 text-orange-700 font-bold py-1.5 rounded text-[10px]"><i class="fa-solid fa-key"></i> Reset</button>
                                <button onclick="aViewTutor(${t.id}, true)" class="flex-1 bg-blue-100 text-blue-700 font-bold py-1.5 rounded text-[10px]"><i class="fa-solid fa-eye"></i> Detail</button>
                                <button onclick="aBlacklist(${t.id})" class="flex-1 bg-gray-800 text-white font-bold py-1.5 rounded text-[10px]"><i class="fa-solid fa-ban"></i> Block</button>
                            </div>
                        </div>
                    `;
                });
            }
            else if(type === 'p_posts' || type === 'a_posts' || type === 'c_posts') { 
                let stat = type==='p_posts'?'pending':(type==='a_posts'?'approved':'completed');
                const { data } = await db.from('job_posts').select('*').eq('status', stat).order('id', {ascending: false});
                if(!data || data.length===0) html = "<p class='text-center text-gray-400'>စာရင်း မရှိသေးပါ</p>";
                for(let p of (data||[])) {
                    html += `<div class="bg-white p-4 rounded-xl border shadow-sm mb-3 text-xs leading-relaxed">
                        <p class="font-bold text-blue-800">ဘာသာရပ်: ${p.subject}</p>
                        <p>ကျောင်းသား: ${p.stu_name} (${p.stu_phone})</p>
                        <p>ဒေသ: ${p.state}, ${p.township}</p>
                        <p>ကြေး: ${p.fee_offer} Ks | Detail: ${p.details}</p>
                        <hr class="my-2">
                    `;
                    if(stat === 'pending') {
                        html += `<div class="flex space-x-2"><button onclick="aApprovePost(${p.id})" class="flex-1 bg-green-600 text-white font-bold py-2 rounded-lg">Approve</button><button onclick="aRejectPost(${p.id})" class="flex-1 bg-red-100 text-red-700 font-bold py-2 rounded-lg">Reject</button></div></div>`;
                    } else if(stat === 'approved') {
                        const apps = await db.from('job_applications').select('id', {count:'exact'}).eq('job_id', p.id);
                        html += `<div class="flex justify-between items-center"><button onclick="aViewApplicants(${p.id}, '${p.subject}', '${p.stu_name}', '${p.stu_phone}')" class="text-blue-600 font-bold underline"><i class="fa-solid fa-users"></i> လျှောက်ထားသူ (${apps.count||0})</button> <button onclick="aCompletePost(${p.id})" class="bg-green-600 text-white px-3 py-1.5 rounded-lg font-bold">Done</button></div></div>`;
                    } else {
                        html += `<p class="font-bold text-green-600"><i class="fa-solid fa-check"></i> ပြီးမြောက်ပြီး</p></div>`;
                    }
                }
            }
            else if(type === 'direct') { 
                const pReq = await db.from('requests').select('*, tutors(name)').eq('status', 'pending');
                html += `<h4 class="font-bold text-orange-600 mb-2">စိစစ်ဆဲ တောင်းဆိုမှုများ</h4>`;

                    html += `<div class="bg-orange-50 p-3 rounded-xl border border-orange-200 mb-2 text-xs flex justify-between items-center">

                        <button onclick="aViewRequest(${r.id})" class="bg-orange-500 text-white px-3 py-1.5 rounded-lg font-bold">Detail</button>
                    </div>`;
                });
                const cReq = await db.from('requests').select('*, tutors(name)').neq('status', 'pending').limit(10);
                html += `<h4 class="font-bold text-gray-600 mt-4 mb-2">မှတ်တမ်းများ (History)</h4>`;
                cReq.data?.forEach(r => {
                    let col = r.status==='completed'?'green':'red';
                    html += `<div class="bg-gray-50 p-2 rounded border mb-2 text-[10px] text-${col}-700">

                    </div>`;
                });
            }
            else if(type === 'noti') { 
                const { data } = await db.from('notifications').select('*').order('timestamp', {ascending: false}).limit(20);
                data?.forEach(n => {
                    html += `<div class="bg-white p-3 rounded-xl border shadow-sm mb-2 text-xs border-l-4 border-l-orange-400">
                        <p class="font-bold text-blue-800">${n.title}</p>
                        <p class="text-gray-600">${n.message}</p>
                        <p class="text-[9px] text-gray-400 mt-1">${new Date(n.timestamp).toLocaleString()}</p>
                    </div>`;
                });
            }
            else if(type === 'chat') { 
                const { data } = await db.from('chat_messages').select('tutor_id, tutors(name, username)').order('timestamp', {ascending: false});
                let tSet = new Set();
                data?.forEach(r => {
                    if(!tSet.has(r.tutor_id)) {
                        tSet.add(r.tutor_id);
                        let n = r.tutors?.name || r.tutors?.username;
                        html += `<button onclick="aOpenChat(${r.tutor_id}, '${n}')" class="w-full text-left bg-white p-3 rounded-xl border shadow-sm mb-2 font-bold text-gray-700 text-sm hover:bg-blue-50 transition"><i class="fa-solid fa-user-circle text-blue-400 text-lg mr-2 align-middle"></i> ${n}</button>`;
                    }
                });
            }
            sub.innerHTML = html || "<p class='text-center text-gray-400'>Data မရှိပါ</p>";
        }

        async function aExecuteBL(id) {
            const r = document.getElementById('a-bl-reason').value;
            if(r) { await db.from('tutors').update({status:'blacklisted', reject_reason:r}).eq('id',id); pushNoti("Blacklist","ဆရာအကောင့်တစ်ခုအား Black List သို့ ပြောင်းရွှေ့လိုက်ပါသည်။"); closeModal(); openAPanel('tutors', 'ဆရာများ စာရင်း'); }
        }

        function aRejectPost(id) {
            openModal(
                `<h3 class="font-bold text-center text-red-600 mb-2">Post Reject လုပ်ရန်</h3><input type="text" id="a-rej-reason" placeholder="အကြောင်းရင်း" class="w-full border p-2 rounded">`,
                `<button onclick="aExecuteRejPost(${id})" class="flex-1 bg-red-600 text-white py-2 rounded font-bold">Reject</button><button onclick="closeModal()" class="flex-1 bg-gray-200 py-2 rounded font-bold">ပိတ်မည်</button>`
            );
        }
        async function aExecuteRejPost(id) {
            const r = document.getElementById('a-rej-reason').value;
            if(r) { await db.from('job_posts').update({status:'rejected', reject_reason:r}).eq('id',id); closeModal(); openAPanel('p_posts', 'စိစစ်ရန် Post များ'); }
        }

        async function aViewTutor(id, isApproved) {
            const { data } = await db.from('tutors').select('*').eq('id', id);
            const r = data[0];
            let html = `
                <div class="space-y-2 text-xs leading-relaxed">
                    <img src="${r.photo||'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full mx-auto object-cover border shadow">
                    <p class="text-center font-bold text-blue-800">${r.username} (Pass: ${r.password})</p><hr>
                    <p>အမည်: ${r.name||'-'} (${r.gender||'-'})</p><p>ဖုန်း: ${r.phone||'-'}</p>
                    <p>ဒေသ: ${r.state||'-'}, ${r.township||'-'}</p><p>သင်ရိုး: ${r.curriculum||'-'} | စနစ်: ${r.teaching_mode||'-'}</p>
                    <p>အတန်း: ${r.grade1} ${r.subject1}</p><p>ရက်/အချိန်: ${r.days} (${r.time})</p><p>ကြေး: <span class="font-bold text-green-600">${r.fee||'-'}</span></p>
                </div>
            `;
            let btns = `<button onclick="closeModal()" class="w-full bg-gray-200 py-2 rounded font-bold">ပိတ်မည်</button>`;
            if(!isApproved) {
                btns = `
                    <button onclick="aApproveTutor(${id}); closeModal()" class="flex-1 bg-green-600 text-white py-2 rounded font-bold">Approve</button>
                    <button onclick="aRejectTutorPrompt(${id})" class="flex-1 bg-red-600 text-white py-2 rounded font-bold">Reject</button>
                    <button onclick="closeModal()" class="flex-1 bg-gray-200 py-2 rounded font-bold">ပိတ်မည်</button>
                `;
            }
            openModal(html, btns);
        }

        function aRejectTutorPrompt(id) {
            openModal(
                `<h3 class="font-bold text-center text-red-600 mb-2">Tutor Reject လုပ်ရန်</h3><input type="text" id="a-rej-t-reason" placeholder="အကြောင်းရင်း" class="w-full border p-2 rounded">`,
                `<button onclick="aExecuteRejTutor(${id})" class="flex-1 bg-red-600 text-white py-2 rounded font-bold">Reject</button><button onclick="closeModal()" class="flex-1 bg-gray-200 py-2 rounded font-bold">ပိတ်မည်</button>`
            );
        }
        async function aExecuteRejTutor(id) {
            const r = document.getElementById('a-rej-t-reason').value;
            if(r) { await db.from('tutors').update({status:'rejected', reject_reason:r}).eq('id',id); closeModal(); openAPanel('new', 'ဆရာသစ် အတည်ပြုရန်'); }
        }

        async function aViewApplicants(jid, subj, sname, sphone) {
            const { data } = await db.from('job_applications').select('*, tutors(*)').eq('job_id', jid);
            let html = `<h4 class="font-bold text-blue-800 text-sm sticky top-0 bg-white pb-2 border-b">Applicants for: ${subj}</h4><div class="mt-2 space-y-2">`;
            if(!data || data.length===0) html += "<p>No applicants.</p>";
            data?.forEach(a => {
                const t = a.tutors || {};
                html += `
                    <div class="bg-gray-50 p-2 rounded border text-xs">
                        <p class="font-bold">${t.name || t.username}</p><p>Ph: ${t.phone}</p>
                        <div class="flex space-x-2 mt-2">
                            <button onclick="aViewTutor(${t.id}, true)" class="flex-1 bg-blue-100 text-blue-700 py-1 rounded">Detail</button>
                            <button onclick="aHire(${t.id}, ${jid}, '${sname}', '${sphone}')" class="flex-1 bg-green-600 text-white py-1 rounded">Hire (Done)</button>
                        </div>
                    </div>
                `;
            });
            html += "</div>";
            openModal(html);
        }

        async function aHire(tid, jid, sname, sphone) {
            await db.from('job_posts').update({status:'completed'}).eq('id',jid);
            await db.from('requests').insert([{tutor_id:tid, student_name:sname, student_phone:sphone, status:'completed', reject_reason:'Post မှ ချိတ်ဆက်ပေးခြင်း'}]);
            closeModal(); showAlert("အောင်မြင်သည်","ချိတ်ဆက်ပေးပြီးပါပြီ","green");
            openAPanel('a_posts', 'စိစစ်ပြီး Post များ');
        }

        async function aViewRequest(rid) {
            const { data } = await db.from('requests').select('*, tutors(*)').eq('id', rid);
            const r = data[0]; const t = r.tutors || {};
            let html = `
                <div class="text-xs leading-relaxed space-y-2">
                    <p class="font-bold text-blue-700 border-b pb-1">ကျောင်းသား: ${r.student_name} (${r.student_phone})</p>
                    <p class="font-bold text-orange-700 border-b pb-1 mt-2">ဆရာ: ${t.name||t.username} (${t.phone||'-'})</p>
                    <p>ဒေသ: ${t.state}, ${t.township} | လစဉ်ကြေး: ${t.fee}</p>
                </div>
            `;
            openModal(html, `
                <button onclick="aApproveReq(${rid})" class="flex-1 bg-green-600 text-white py-2 rounded font-bold">ချိတ်ဆက်မည်</button>
                <button onclick="aRejectReqPrompt(${rid})" class="flex-1 bg-red-600 text-white py-2 rounded font-bold">ငြင်းပယ်မည်</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-200 py-2 rounded font-bold">ပိတ်မည်</button>
            `);
        }

        async function aApproveReq(rid) {
            await db.from('requests').update({status:'completed'}).eq('id',rid); closeModal(); openAPanel('direct', 'Direct Booking စိစစ်ရန်');
        }
        function aRejectReqPrompt(rid) {
            openModal(
                `<h3 class="font-bold text-center text-red-600 mb-2">Request ငြင်းပယ်ရန်</h3><input type="text" id="a-rej-r-reason" placeholder="အကြောင်းရင်း" class="w-full border p-2 rounded">`,
                `<button onclick="aExecuteRejReq(${rid})" class="flex-1 bg-red-600 text-white py-2 rounded font-bold">Reject</button><button onclick="closeModal()" class="flex-1 bg-gray-200 py-2 rounded font-bold">ပိတ်မည်</button>`
            );
        }
        async function aExecuteRejReq(rid) {
            const r = document.getElementById('a-rej-r-reason').value;
            if(r) { 
                await db.from('requests').update({status:'rejected', reject_reason:r}).eq('id',rid); 
                pushNoti("ချိတ်ဆက်မှု ငြင်းပယ်ခြင်း", "တောင်းဆိုချက်အား ငြင်းပယ်လိုက်ပါသည်။");
                closeModal(); openAPanel('direct', 'Direct Booking စိစစ်ရန်'); 
            }
        }

        // Live Admin Chat (Images & Text)
        function aOpenChat(tid, tname) {
            if(chatInterval) clearInterval(chatInterval); // Clear old timer

            a_chat_id = tid;
            document.getElementById('a-sub').innerHTML = `
                <div class="bg-white p-3 rounded-xl border shadow flex flex-col h-[65vh]">
                    <h4 class="font-bold text-blue-800 border-b pb-2"><i class="fa-solid fa-comments"></i> Chat: ${tname}</h4>
                    <div id="a-chat-box" class="flex-1 overflow-y-auto space-y-2 p-2 bg-gray-50 mt-2 rounded border text-xs"></div>
                    <div class="flex items-center space-x-2 mt-2">
                        <input type="file" id="a-chat-file" accept="image/*" class="hidden" onchange="aSendChatImage(event)">
                        <button onclick="document.getElementById('a-chat-file').click()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 w-10 h-10 rounded transition"><i class="fa-solid fa-image"></i></button>

                        <input type="text" id="a-chat-input" placeholder="စာပြန်ရန်..." class="flex-1 border p-2 rounded outline-none">
                        <button onclick="aSendChat()" class="bg-blue-600 text-white w-10 h-10 rounded font-bold hover:bg-blue-700"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
            aLoadChatBox();
            chatInterval = setInterval(aLoadChatBox, 3000); // ၃ စက္ကန့်တိုင်း Live Refresh လုပ်မည်
        }

        async function aLoadChatBox() {
            if(!a_chat_id) return;
            const box = document.getElementById('a-chat-box');

            // Scroll အောက်ဆုံးမှာ ရှိမရှိ စစ်မည် (စာဖတ်နေရင် Auto မဆွဲချစေရန်)
            const isNearBottom = box.scrollHeight - box.clientHeight - box.scrollTop <= 50;

            const { data } = await db.from('chat_messages').select('*').eq('tutor_id', a_chat_id).order('timestamp');
            box.innerHTML = "";
            data?.forEach(msg => {
                const me = msg.sender === 'admin';
                let contentHTML = msg.image_data 
                    ? `<img src="${msg.image_data}" class="w-32 h-auto rounded-lg shadow-sm border mt-1">` 
                    : `<p>${msg.message}</p>`;

                box.innerHTML += `
                    <div class="flex ${me ? 'justify-end' : 'justify-start'}">
                        <div class="${me ? 'bg-green-100' : 'bg-white border'} p-2 rounded-lg max-w-[80%] shadow-sm">
                            <p class="font-bold text-[9px] text-gray-500 mb-0.5">${me ? 'Admin (Me)' : 'Teacher'}</p>
                            ${contentHTML}
                        </div>
                    </div>
                `;
            });
            
            if (isNearBottom) box.scrollTop = box.scrollHeight;
        }

        async function aSendChat() {
            const inp = document.getElementById('a-chat-input');
            if(!inp.value.trim() || !a_chat_id) return;
            await db.from('chat_messages').insert([{ tutor_id: a_chat_id, sender: 'admin', message: inp.value, image_data: null }]);
            inp.value = ""; 
            aLoadChatBox();
            setTimeout(() => { document.getElementById('a-chat-box').scrollTop = document.getElementById('a-chat-box').scrollHeight; }, 100);
        }

        function aSendChatImage(e) {
            const file = e.target.files[0];
            if(file) {
                compressImage(file, async function(base64data) {
                    await db.from('chat_messages').insert([{ tutor_id: a_chat_id, sender: 'admin', message: '[ဓာတ်ပုံ]', image_data: base64data }]);
                    aLoadChatBox();
                    setTimeout(() => { document.getElementById('a-chat-box').scrollTop = document.getElementById('a-chat-box').scrollHeight; }, 300);
                });
            }
        }
        
    </script>
